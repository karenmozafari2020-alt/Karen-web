<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مالک | KAREN WEB</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:1000px;margin:50px auto;padding:0 20px}.admin-panel{background:#151522;border:1px solid #ffffff20;border-radius:14px;padding:24px;margin:20px 0}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-form input,.admin-form textarea{width:100%;background:#0d0e18;color:white;border:1px solid #ffffff20;border-radius:8px;padding:12px;font:12px Vazirmatn}.admin-form textarea{grid-column:1/-1;min-height:80px}.admin-form button{grid-column:1/-1}.hint{color:#9999aa;font-size:11px;line-height:2}.admin-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff16;padding:13px 0;font-size:11px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:#ffffff0c;border:1px solid #ffffff20;color:#ddd;padding:9px 14px;border-radius:20px;font:11px Vazirmatn}.tabs button.active{background:#9c7cff30;border-color:#a995f3}.admin-chat{display:flex;gap:8px;margin-top:15px}.admin-chat input{flex:1;background:#0d0e18;border:1px solid #ffffff20;border-radius:8px;color:white;padding:12px}.admin-chat button{background:#9c7cff;color:#100d1d;border:0;border-radius:8px;padding:8px 16px}.user-select{background:#0d0e18;color:white;padding:8px;border:1px solid #ffffff20;border-radius:8px}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.admin-row{flex-direction:column}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">K</span><span>KAREN<span class="brand-light">WEB</span><small>OWNER CONTROL CENTER</small></span></a><a class="admin-link" href="/">بازگشت به فروشگاه ↗</a></header><main class="admin-wrap"><div class="eyebrow">OWNER ACCESS</div><h1>پنل مالک KAREN WEB</h1><p class="hint">این پنل فقط برای حساب مالک KARENONE است. حساب مالک از متغیرهای امن Render ساخته می‌شود.</p>
<div class="tabs"><button class="active" data-tab="products">قالب‌ها</button><button data-tab="orders">سفارش‌ها</button><button data-tab="users">کاربران</button><button data-tab="messages">پیام‌ها</button></div>
<section class="admin-panel" id="tab-products"><h2>افزودن قالب</h2><form id="productForm" class="admin-form"><input name="title" placeholder="نام قالب" required><input name="category" placeholder="دسته‌بندی" required><input name="price_rial" type="number" min="1" placeholder="قیمت به ریال" required><input name="image_url" placeholder="آدرس تصویر اختیاری"><input name="storage_path" placeholder="مسیر فایل ZIP در Storage"><textarea name="description" placeholder="توضیحات قالب"></textarea><label class="hint"><input type="checkbox" name="featured"> قالب ویژه</label><button class="btn primary">ثبت قالب</button></form><p id="productMessage" class="hint"></p></section>
<section class="admin-panel" id="tab-orders" hidden><h2>سفارش‌ها</h2><div id="orders" class="hint">در حال دریافت...</div></section>
<section class="admin-panel" id="tab-users" hidden><h2>حساب‌های کاربری</h2><div id="users" class="hint">در حال دریافت...</div></section>
<section class="admin-panel" id="tab-messages" hidden><h2>صندوق پیام‌ها</h2><div id="messages" class="hint">در حال دریافت...</div><div class="admin-chat"><select id="messageUser" class="user-select"></select><input id="replyText" maxlength="2000" placeholder="پاسخ به کاربر..."><button id="replyButton">ارسال پاسخ</button></div></section>
</main><script>
const $=s=>document.querySelector(s);async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d;}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['products','orders','users','messages'].forEach(t=>$('#tab-'+t).hidden=t!==b.dataset.tab);});
$('#productForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f.entries());b.price_rial=Number(b.price_rial);b.featured=f.has('featured');try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('#productMessage').textContent='قالب ثبت شد.';e.target.reset();}catch(x){$('#productMessage').textContent=x.message;}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=[];
async function load(){try{const [orders,us]=await Promise.all([api('/api/admin/orders'),api('/api/admin/users')]);users=us;$('#orders').innerHTML=orders.map(o=>`<div class="admin-row"><span>${esc(o.product_title)}<br>${new Date(o.created_at).toLocaleString('fa-IR')}</span><b>${Number(o.amount_rial).toLocaleString('fa-IR')} ریال — ${esc(o.status)}</b></div>`).join('')||'سفارشی وجود ندارد.';$('#users').innerHTML=us.map(u=>`<div class="admin-row"><span>${esc(u.username)}</span><b>${esc(u.role)}</b></div>`).join('');$('#messageUser').innerHTML=us.filter(u=>u.role!=='admin').map(u=>`<option value="${esc(u.id)}">${esc(u.username)}</option>`).join('');await loadMessages();}catch(e){$('#orders').textContent=e.message;}}
async function loadMessages(){try{const m=await api('/api/messages');$('#messages').innerHTML=m.map(x=>`<div class="admin-row"><span><b>${esc(x.sender_role)}</b> — ${esc(x.body)}</span><small>${new Date(x.created_at).toLocaleString('fa-IR')}</small></div>`).join('')||'پیامی نیست.';}catch(e){$('#messages').textContent=e.message;}}
$('#replyButton').onclick=async()=>{const body=$('#replyText').value.trim(),user_id=$('#messageUser').value;if(!body||!user_id)return;try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,user_id})});$('#replyText').value='';await loadMessages();}catch(e){alert(e.message);}};
load();
</script></body></html>
