<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتیجه پرداخت | KAREN WEB</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:650px;margin:15vh auto;padding:25px;text-align:center"><div class="brand-mark" style="margin:auto">K</div><h1 id="title">در حال بررسی سفارش...</h1><p id="detail" style="color:#aaa;line-height:2"></p><a class="btn primary" href="/">بازگشت به فروشگاه</a><div id="download" style="margin-top:20px"></div></main><script>
const p=new URLSearchParams(location.search),id=p.get('order'),ok=p.get('result')==='success';
(async()=>{if(!ok){document.querySelector('#title').textContent='پرداخت تأیید نشد';document.querySelector('#detail').textContent='اگر پرداخت را انجام داده‌ای، از بخش پیام‌های حساب با پشتیبانی تماس بگیر.';return;}if(!id)return;try{const r=await fetch('/api/order-status/'+encodeURIComponent(id));const d=await r.json();if(!r.ok||d.status!=='paid')throw 0;document.querySelector('#title').textContent='پرداخت با موفقیت تأیید شد';document.querySelector('#detail').textContent='سفارش '+d.product_title+' ثبت شده است.';document.querySelector('#download').innerHTML='<a class="btn primary" href="/api/download/'+encodeURIComponent(id)+'">دریافت فایل قالب</a>';}catch{document.querySelector('#title').textContent='در انتظار تأیید سفارش';document.querySelector('#detail').textContent='وضعیت سفارش هنوز تأیید نشده است. وارد همان حساب کاربری شو و دوباره بررسی کن.';}})();
</script></body></html>
